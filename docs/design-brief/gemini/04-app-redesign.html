<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traike — App Interface Redesign (Round 4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     1. ROLE-BASED DESIGN TOKENS (DAY + DUSK-NIGHT)
     5-step strict type scale, hard-edged radii, zero slop
     ========================================================= */
  :root {
    --bg: #e7e0d2;
    --surface: #faf7f0;
    --surface-subtle: #f1ece0;
    --ink: #181512;
    --muted: #5a534a;
    --line: #d6cebe;
    --line-strong: #181512;
    --primary: #e86b3c;
    --primary-hover: #dc5e2f;
    --on-primary: #181512;
    --route-past: #b3ab9c;
    --forest: #1e3d2f;
    --danger: #b42f24;

    /* Map tokens */
    --map-road: #faf7f0;
    --map-block: #e3dcd0;
    --map-block-line: #cfc6b6;
    --map-park: #dce3d3;
    --map-water: #cadce2;

    /* 5-size strict type scale (nothing < 13px) */
    --fs-xs: 0.8125rem;   /* 13px */
    --fs-sm: 0.9375rem;   /* 15px */
    --fs-base: 1rem;      /* 16px */
    --fs-lg: 1.375rem;    /* 22px */
    --fs-hero: 4.25rem;   /* 68px */

    --font-serif: 'Fraunces', 'Frank Ruhl Libre', Georgia, serif;
    --font-sans: 'Heebo', system-ui, -apple-system, sans-serif;

    /* Hard-edged architectural radii */
    --r-sm: 4px;
    --r-md: 6px;
    --r-lg: 8px;

    /* Crisp minimal shadows (no soft glow) */
    --shadow-frame: 0 12px 32px rgba(24, 21, 18, 0.14);
    --shadow-pin: 0 2px 0 rgba(24, 21, 18, 0.9);
  }

  :root[data-theme="night"] {
    --bg: #110f0d;
    --surface: #1b1815;
    --surface-subtle: #24201c;
    --ink: #f4efe6;
    --muted: #b2a99b;
    --line: #342f29;
    --line-strong: #564e45;
    --primary: #ea7144;
    --primary-hover: #f27f54;
    --on-primary: #14110e;
    --route-past: #565049;
    --forest: #88bfa3;
    --danger: #f06b5f;

    --map-road: #161412;
    --map-block: #211e1b;
    --map-block-line: #302b26;
    --map-park: #1c261f;
    --map-water: #18262c;

    --shadow-frame: 0 14px 38px rgba(0, 0, 0, 0.55);
    --shadow-pin: 0 2px 0 rgba(0, 0, 0, 0.95);
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #1e1b18;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea, select {
    font: inherit;
    color: inherit;
  }

  /* =========================================================
     2. GALLERY PRESENTATION SHELL (OUTSIDE THE APP FRAME)
     ========================================================= */
  .gallery-bar {
    background: #141210;
    color: #f4efe6;
    border-bottom: 1px solid #2e2924;
    padding-block: 10px;
    padding-inline: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .gallery-bar-inner {
    max-width: 1240px;
    margin-inline: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .gallery-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .gallery-brand strong {
    font-family: var(--font-serif);
    font-size: var(--fs-lg);
    color: #ea7144;
    letter-spacing: -0.02em;
  }

  .gallery-brand span {
    font-size: var(--fs-xs);
    color: #a9a093;
  }

  .gallery-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .g-seg {
    display: inline-flex;
    border: 1px solid #3c3630;
    border-radius: var(--r-sm);
    overflow: hidden;
    background: #1d1a17;
  }

  .g-seg button {
    border: 0;
    border-inline-end: 1px solid #3c3630;
    background: transparent;
    color: #c8bfb2;
    font-size: var(--fs-xs);
    font-weight: 700;
    padding-block: 7px;
    padding-inline: 11px;
    cursor: pointer;
    min-height: 34px;
  }

  .g-seg button:last-child {
    border-inline-end: 0;
  }

  .g-seg button.active {
    background: #ea7144;
    color: #14110e;
  }

  .screen-strip {
    background: #191614;
    border-bottom: 1px solid #2c2722;
    padding-block: 8px;
    padding-inline: 16px;
  }

  .screen-strip-inner {
    max-width: 1240px;
    margin-inline: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }

  .screen-pill {
    border: 1px solid #3a342e;
    background: #211d1a;
    color: #d6cec1;
    border-radius: var(--r-sm);
    font-size: var(--fs-xs);
    font-weight: 700;
    padding-block: 7px;
    padding-inline: 12px;
    cursor: pointer;
    min-height: 36px;
  }

  .screen-pill.active {
    background: #f4efe6;
    color: #141210;
    border-color: #f4efe6;
  }

  .stage-wrap {
    padding-block: 24px 48px;
    padding-inline: 12px;
    display: flex;
    justify-content: center;
    background: var(--bg);
    min-height: calc(100vh - 106px);
    transition: background 0.15s ease;
  }

  /* =========================================================
     3. PRODUCT FRAME (PHONE 390px & DESKTOP 1180px)
     ========================================================= */
  .app-frame {
    background: var(--surface);
    color: var(--ink);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-frame);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .app-frame[data-device="phone"] {
    width: 390px;
    max-width: 100%;
    min-height: 780px;
  }

  .app-frame[data-device="desktop"] {
    width: 1180px;
    max-width: 100%;
    min-height: 740px;
    flex-direction: row;
  }

  /* Directional icon mirroring in Hebrew RTL */
  [dir="rtl"] .dir-flip {
    transform: scaleX(-1);
  }

  /* =========================================================
     4. NAVIGATION: DESKTOP INLINE-START RAIL & PHONE TAB BAR
     ========================================================= */
  .desktop-rail {
    display: none;
  }

  .app-frame[data-device="desktop"] .desktop-rail {
    display: flex;
    flex-direction: column;
    width: 204px;
    flex-shrink: 0;
    background: var(--surface-subtle);
    border-inline-end: 1px solid var(--line);
    padding: 16px 12px;
    justify-content: space-between;
  }

  .brand-lockup {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-inline: 6px;
    padding-block-end: 14px;
    border-bottom: 1px solid var(--line);
    margin-block-end: 12px;
  }

  .brand-word {
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: var(--fs-lg);
    color: var(--ink);
    letter-spacing: -0.02em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
    background: var(--primary);
    border: 1.5px solid var(--ink);
    border-radius: var(--r-sm);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #181512;
  }

  .rail-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .rail-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding-inline: 10px;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--ink);
    font-size: var(--fs-sm);
    font-weight: 700;
    text-align: start;
    cursor: pointer;
  }

  .rail-btn:hover {
    background: var(--surface);
    border-color: var(--line);
  }

  /* Solid fill selected state (never border-only) */
  .rail-btn.active {
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }

  .rail-footer {
    border-top: 1px solid var(--line);
    padding-block-start: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Phone top bar */
  .phone-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-block: 8px;
    padding-inline: 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    min-height: 48px;
  }

  .app-frame[data-device="desktop"] .phone-topbar {
    display: none;
  }

  /* Phone bottom tab bar */
  .phone-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 4px;
    gap: 3px;
    margin-block-start: auto;
  }

  .app-frame[data-device="desktop"] .phone-tabs {
    display: none;
  }

  .tab-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: var(--r-sm);
    min-height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: var(--fs-xs);
    font-weight: 700;
    cursor: pointer;
    padding-inline: 2px;
  }

  .tab-btn.active {
    background: var(--ink);
    color: var(--surface);
  }

  /* =========================================================
     5. WORKSPACE & BUSBO SPLIT ARCHITECTURE
     ========================================================= */
  .workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .screen-view {
    display: none;
    flex: 1;
    min-width: 0;
  }

  .screen-view.active {
    display: flex;
    flex-direction: column;
  }

  .app-frame[data-device="desktop"] .screen-view.active {
    flex-direction: row;
  }

  /* Primary functional sheet (inline-start on desktop) */
  .sheet-col {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    min-width: 0;
    flex: 1;
  }

  .app-frame[data-device="desktop"] .sheet-col {
    width: 420px;
    flex: 0 0 420px;
    border-inline-end: 1px solid var(--line);
  }

  .app-frame[data-device="desktop"] .sheet-col.wide-sheet {
    width: 460px;
    flex: 0 0 460px;
  }

  /* Star canvas column (map or editorial stage on inline-end) */
  .canvas-col {
    position: relative;
    flex: 1;
    min-width: 0;
    background: var(--map-road);
    display: flex;
    flex-direction: column;
  }

  .app-frame[data-device="phone"] .desktop-only-canvas {
    display: none;
  }

  /* =========================================================
     6. BESPOKE SCENE + GIANT SERIF HERO NUMERAL
     ========================================================= */
  .scene-box {
    position: relative;
    width: 100%;
    height: 146px;
    overflow: hidden;
    border-bottom: 1px solid var(--line-strong);
    background: var(--surface-subtle);
    flex-shrink: 0;
  }

  .scene-box.compact {
    height: 118px;
  }

  .scene-box.tall {
    height: 180px;
  }

  .scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Busbo-formula hero metric row straddling the dark foreground ridge */
  .hero-metric-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-inline: 16px;
    padding-block: 10px 12px;
    border-bottom: 1px solid var(--line);
    position: relative;
    gap: 12px;
  }

  .hero-numeral-group {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-block-start: -38px;
    position: relative;
    z-index: 3;
  }

  .giant-num {
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: var(--fs-hero);
    line-height: 0.84;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    paint-order: stroke fill;
    -webkit-text-stroke: 6px var(--surface);
    letter-spacing: -0.03em;
  }

  .giant-unit-stack {
    display: flex;
    flex-direction: column;
  }

  .giant-unit {
    font-size: var(--fs-lg);
    font-weight: 800;
    line-height: 1.05;
    color: var(--ink);
  }

  .giant-sub {
    font-size: var(--fs-xs);
    color: var(--muted);
    font-weight: 500;
  }

  .hero-badge-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .solid-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary);
    color: var(--on-primary);
    border: 1.5px solid var(--ink);
    border-radius: var(--r-sm);
    padding-block: 4px;
    padding-inline: 10px;
    font-size: var(--fs-sm);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  /* 3D accessory slot — strictly contained, never overlaps text */
  .acc-slot {
    position: absolute;
    inset-block-start: 10px;
    inset-inline-end: 12px;
    width: 52px;
    height: 52px;
    z-index: 2;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .acc-slot img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
  }

  /* =========================================================
     7. HARD-EDGED ROWS, TIMELINES, SEGMENTED CONTROLS & CTA
     ========================================================= */
  .sec-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-block: 8px;
    padding-inline: 16px;
    background: var(--surface-subtle);
    border-bottom: 1px solid var(--line);
    font-size: var(--fs-xs);
    font-weight: 800;
    color: var(--ink);
  }

  .sec-bar span.muted {
    font-weight: 500;
    color: var(--muted);
  }

  .pad-block {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .h-title {
    margin: 0 0 4px 0;
    font-family: var(--font-serif);
    font-size: var(--fs-lg);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .h-helper {
    margin: 0;
    font-size: var(--fs-sm);
    color: var(--muted);
    line-height: 1.35;
  }

  /* Busbo-style stop timeline */
  .timeline-list {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--line);
  }

  .tl-row {
    display: grid;
    grid-template-columns: 52px 22px 1fr auto;
    align-items: center;
    gap: 8px;
    padding-block: 10px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--line);
    font-size: var(--fs-sm);
    position: relative;
  }

  .tl-row:last-child {
    border-bottom: 0;
  }

  .tl-time {
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: var(--fs-xs);
    color: var(--ink);
  }

  .tl-row.past .tl-time,
  .tl-row.past .tl-name {
    color: var(--muted);
    text-decoration: line-through;
  }

  .tl-node-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 100%;
  }

  .tl-dot {
    width: 11px;
    height: 11px;
    border-radius: 99px;
    background: var(--surface);
    border: 2.5px solid var(--ink);
    z-index: 1;
  }

  .tl-row.past .tl-dot {
    background: var(--route-past);
    border-color: var(--route-past);
  }

  /* Active / featured row in solid charcoal bar (busbo signature) */
  .tl-row.active-stop {
    background: var(--ink);
    color: var(--surface);
  }

  .tl-row.active-stop .tl-time {
    background: var(--primary);
    color: #181512;
    padding-block: 2px;
    padding-inline: 6px;
    border-radius: 3px;
    text-align: center;
  }

  .tl-row.active-stop .tl-dot {
    background: var(--primary);
    border-color: var(--surface);
  }

  .tl-row.active-stop .tl-tag {
    color: var(--surface);
    opacity: 0.82;
  }

  .tl-name {
    font-weight: 700;
    font-size: var(--fs-base);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tl-tag {
    font-size: var(--fs-xs);
    color: var(--muted);
    font-weight: 500;
  }

  /* Hard-edged Buttons */
  .btn-primary {
    width: 100%;
    min-height: 48px;
    background: var(--primary);
    color: var(--on-primary);
    border: 1.5px solid var(--ink);
    border-radius: var(--r-sm);
    font-size: var(--fs-base);
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 2px 0 var(--ink);
    transition: transform 0.06s ease, background 0.12s ease;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
  }

  .btn-primary:active {
    transform: translateY(1px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .btn-secondary {
    min-height: 44px;
    padding-inline: 12px;
    background: var(--surface-subtle);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    font-size: var(--fs-sm);
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
  }

  .btn-secondary:hover {
    background: var(--line);
  }

  /* Segmented Control (1px grid, solid fill active) */
  .seg-grid {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    overflow: hidden;
    background: var(--surface);
  }

  .seg-cell {
    min-height: 44px;
    border: 0;
    border-inline-end: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: var(--fs-sm);
    font-weight: 700;
    cursor: pointer;
    padding-inline: 6px;
  }

  .seg-cell:last-child {
    border-inline-end: 0;
  }

  .seg-cell.active-orange {
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 800;
  }

  .seg-cell.active-ink {
    background: var(--ink);
    color: var(--surface);
    font-weight: 800;
  }

  /* Dense List Rows */
  .dense-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--line);
  }

  .dense-row-main {
    min-width: 0;
    flex: 1;
  }

  .dense-title {
    font-size: var(--fs-base);
    font-weight: 700;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dense-meta {
    font-size: var(--fs-xs);
    color: var(--muted);
    margin: 2px 0 0 0;
    font-variant-numeric: tabular-nums;
  }

  /* =========================================================
     8. PLAN SCREEN: REAL GUIDE CHARACTER + 5 PHOTO TILES
     ========================================================= */
  .guide-header {
    position: relative;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .guide-card-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding-inline: 16px;
    padding-block: 0 12px;
    margin-block-start: -34px;
    position: relative;
    z-index: 3;
  }

  .guide-portrait {
    width: 74px;
    height: 88px;
    flex-shrink: 0;
    border-radius: var(--r-md);
    border: 2px solid var(--ink);
    background: var(--surface-subtle);
    overflow: hidden;
    box-shadow: 0 2px 0 var(--ink);
  }

  .guide-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  .guide-speech {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--r-md);
    padding: 9px 11px;
    min-width: 0;
  }

  .guide-speech strong {
    display: block;
    font-size: var(--fs-sm);
    font-weight: 800;
    color: var(--ink);
    margin-block-end: 2px;
  }

  .guide-speech p {
    margin: 0;
    font-size: var(--fs-xs);
    color: var(--muted);
    line-height: 1.35;
  }

  /* 5 Theme Photo Chips — solid fill when selected */
  .theme-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .theme-tile {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 44px;
    padding-block: 4px;
    padding-inline: 6px 10px;
    background: var(--surface-subtle);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    font-size: var(--fs-xs);

  /* =========================================================
     BESPOKE FLAT-VECTOR ILLUSTRATED TRAIL SCENE (BUSBO FORMULA)
     3-4 crisp tonal planes, terracotta sun / night moon + lit tent,
     waymarker post, winding trail, hiker silhouette
     ========================================================= */
  function renderLandscapeSVG() {
    const isNight = state.theme === 'night';
    const sky = isNight ? '#1c1815' : '#efe8d8';
    const ridgeFar = isNight ? '#2b2520' : '#dcd2be';
    const ridgeMid = isNight ? '#1f362b' : '#264938';
    const ground = isNight ? '#0e0c0a' : '#181512';
    const trail = isNight ? '#5c5449' : '#f5efe2';
    const tentBody = isNight ? '#e86b3c' : '#faf7f0';
    const tentShade = isNight ? '#b54922' : '#dfd6c5';

    return `
      <svg class="scene-svg" viewBox="0 0 440 156" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="440" height="156" fill="${sky}"/>
        ${isNight ? `
          <circle cx="96" cy="42" r="20" fill="#f4efe6"/>
          <circle cx="104" cy="37" r="16" fill="${sky}"/>
          <rect x="44" y="24" width="3" height="3" fill="#f4efe6"/>
          <rect x="176" y="20" width="3" height="3" fill="#f4efe6"/>
          <rect x="280" y="30" width="3" height="3" fill="#f4efe6"/>
          <rect x="360" y="18" width="3" height="3" fill="#f4efe6"/>
        ` : `
          <circle cx="98" cy="46" r="27" fill="#e86b3c"/>
        `}
        <!-- Far sandstone mesa ridge -->
        <polygon points="0,104 68,72 132,86 218,54 294,78 368,58 440,80 440,124 0,124" fill="${ridgeFar}"/>
        <!-- Mid forest ridge + flat geometric cypresses -->
        <polygon points="0,114 88,92 174,104 266,80 356,94 440,84 440,130 0,130" fill="${ridgeMid}"/>
        <polygon points="196,68 202,94 190,94" fill="${ridgeMid}"/>
        <polygon points="210,74 215,95 205,95" fill="${ridgeMid}"/>
        <!-- Pitched trail tent on ridge -->
        <polygon points="312,108 328,84 344,108" fill="${tentBody}" stroke="${ground}" stroke-width="2"/>
        <polygon points="328,84 344,108 354,105 338,83" fill="${tentShade}" stroke="${ground}" stroke-width="2"/>
        <polygon points="324,108 328,95 332,108" fill="${isNight ? '#ffd27d' : '#e86b3c'}"/>
        <!-- Near-black warm foreground plane (anchors the giant serif numeral) -->
        <rect x="0" y="108" width="440" height="48" fill="${ground}"/>
        <!-- Winding perspective trail + orange blaze dashes -->
        <polygon points="204,108 222,108 274,156 232,156" fill="${trail}"/>
        <line x1="216" y1="114" x2="225" y2="122" stroke="#e86b3c" stroke-width="3"/>
        <line x1="231" y1="129" x2="242" y2="140" stroke="#e86b3c" stroke-width="3"/>
        <!-- Waymarker trail post -->
        <line x1="278" y1="92" x2="278" y2="122" stroke="${trail}" stroke-width="3"/>
        <rect x="278" y="94" width="18" height="9" fill="#e86b3c" stroke="${ground}" stroke-width="1.5"/>
        <!-- Crisp hiker figure on ridge -->
        <circle cx="156" cy="91" r="4" fill="${ground}"/>
        <path d="M156,96 L153,108 M156,98 L162,103 M149,96 L154,96 L153,104 L148,104 Z" stroke="${ground}" stroke-width="2.5" fill="${ground}"/>
        <line x1="163" y1="95" x2="165" y2="109" stroke="${ground}" stroke-width="1.8"/>
      </svg>
    `;
  }

            </div>
          </div>
          <div class="hero-badge-stack">
            <span class="solid-pill">${t.badge}</span>
          </div>
        </div>

        <div class="pad-block">
          <div class="seg-grid">
            <button type="button" class="seg-cell ${state.walksTab === 'mine' ? 'active-ink' : ''}" onclick="state.walksTab='mine';renderWalks();">${t.tabMine}</button>
            <button type="button" class="seg-cell ${state.walksTab === 'social' ? 'active-ink' : ''}" onclick="state.walksTab='social';renderWalks();">${t.tabSocial}</button>
          </div>
        </div>

        <div>
          ${rows.map(r => `
            <div class="dense-row">
              ${ICONS.miniRoute}
              <div class="dense-row-main">
                <p class="dense-title">${r.title}</p>
                <p class="dense-meta">${r.meta}</p>
              </div>
              <button type="button" class="btn-secondary" onclick="setScreen('walk')">${r.action}</button>
            </div>
          `).join('')}
        </div>

        <div class="pad-block" style="border-bottom:0;">
          <button type="button" class="btn-primary" onclick="setScreen('plan')">
            <span>${t.cta}</span>
            ${ICONS.arrow}
          </button>
        </div>
      </div>

      <div class="canvas-col desktop-only-canvas">
        <div class="map-stage">
          ${renderMapSVG('walks')}
          <div class="map-attr">© OpenStreetMap · Traike</div>
        </div>
      </div>
    `;
  }

  /* =========================================================
     SCREEN E: ME & SETTINGS
     ========================================================= */
  function renderMe() {
    const t = I18N[state.lang].me;

    document.getElementById('screen-me').innerHTML = `
      <div class="sheet-col wide-sheet">
        <div class="scene-box compact">
          ${renderLandscapeSVG()}
        </div>

        <div class="pad-block" style="display:flex;align-items:center;gap:12px;">
          <div class="pin-square" style="font-family:var(--font-serif);font-weight:900;font-size:var(--fs-lg);">NL</div>
          <div class="dense-row-main">
            <h2 class="h-title">${t.name}</h2>
            <p class="h-helper">${t.sub}</p>
          </div>
        </div>

        <div class="sec-bar"><span>${t.secPrefs}</span></div>

        <div class="pad-block">
          <div class="field-label"><label>${t.langLabel}</label></div>
          <div class="seg-grid">
            <button type="button" class="seg-cell ${state.lang === 'en' ? 'active-ink' : ''}" onclick="setLang('en')">English</button>
            <button type="button" class="seg-cell ${state.lang === 'he' ? 'active-ink' : ''}" onclick="setLang('he')">עברית</button>
          </div>
        </div>

        <div class="pad-block">
          <div class="field-label"><label>${t.themeLabel}</label></div>
          <div class="seg-grid">
            <button type="button" class="seg-cell ${state.theme === 'day' ? 'active-orange' : ''}" onclick="setTheme('day')">${t.dayOpt}</button>
            <button type="button" class="seg-cell ${state.theme === 'night' ? 'active-orange' : ''}" onclick="setTheme('night')">${t.nightOpt}</button>
          </div>
        </div>

        <div class="dense-row">
          <div class="dense-row-main">
            <p class="dense-title">${t.offlineLabel}</p>
            <p class="dense-meta">${t.offlineMeta}</p>
          </div>
          <span class="solid-pill">OK</span>
        </div>

        <div class="pad-block" style="display:flex;flex-direction:column;gap:8px;border-bottom:0;">
          <button type="button" class="btn-primary" onclick="setScreen('home')">${t.cta}</button>
          <button type="button" class="btn-secondary" style="width:100%;" onclick="setScreen('login')">${t.signOut}</button>
        </div>
      </div>

      <div class="canvas-col desktop-only-canvas">
        <div class="map-stage">
          ${renderMapSVG('me')}
          <div class="map-attr">© OpenStreetMap · Traike</div>
        </div>
      </div>
    `;
  }

  /* =========================================================
     SCREEN F: LOGIN (SCENE + REAL GUIDE + ONE PRIMARY ACTION)
     ========================================================= */
  function renderLogin() {
    const t = I18N[state.lang].login;
    const guideImg = state.theme === 'night' ? 'assets/guide-night.jpg' : 'assets/guide.jpg';

    document.getElementById('screen-login').innerHTML = `
      <div class="sheet-col wide-sheet">
        <div class="guide-header">
          <div class="scene-box tall">
            ${renderLandscapeSVG()}
          </div>
          <div class="guide-card-row">
            <div class="guide-portrait">
              <img src="${guideImg}" alt="Traike guide" onerror="this.src='${FALLBACK_GUIDE}'" />
            </div>
            <div class="guide-speech">
              <strong>${t.title}</strong>
              <p>${t.helper}</p>
            </div>
          </div>
        </div>

        <div class="pad-block">
          <div class="field-label"><label for="loginEmail">${t.emailLabel}</label></div>
          <input id="loginEmail" type="email" class="hard-input" value="${t.emailPh}" />
        </div>

        <div class="pad-block" style="display:flex;flex-direction:column;gap:10px;border-bottom:0;">
          <button type="button" class="btn-primary" onclick="setScreen('home')">
            <span>${t.cta}</span>
            ${ICONS.arrow}
          </button>
          <button type="button" class="btn-secondary" style="width:100%;" onclick="setScreen('home')">${t.googleBtn}</button>
          <button type="button" style="border:0;background:none;text-decoration:underline;min-height:44px;font-size:var(--fs-sm);font-weight:700;cursor:pointer;" onclick="setScreen('plan')">${t.guestBtn}</button>
        </div>
      </div>

      <div class="canvas-col desktop-only-canvas">
        <div class="map-stage">
          ${renderMapSVG('login')}
          <div class="map-attr">© OpenStreetMap · Traike</div>
        </div>
      </div>
    `;
  }

  /* =========================================================
     REQUIRED PUBLIC CONTROLLER FUNCTIONS
     setDevice / setLang / setTheme / setScreen
     ========================================================= */
  function renderAll() {
    renderNav();
    renderHome();
    renderPlan();
    renderWalk();
    renderWalks();
    renderMe();
    renderLogin();
  }

  function setDevice(dev) {
    state.device = dev;
    document.getElementById('appFrame').setAttribute('data-device', dev);
    document.getElementById('btn-dev-phone').classList.toggle('active', dev === 'phone');
    document.getElementById('btn-dev-desktop').classList.toggle('active', dev === 'desktop');
    renderWalk();
  }

  function setLang(lang) {
    state.lang = lang;
    const dir = lang === 'he' ? 'rtl' : 'ltr';
    const frame = document.getElementById('appFrame');
    frame.setAttribute('dir', dir);
    frame.setAttribute('lang', lang);
    document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-lang-he').classList.toggle('active', lang === 'he');
    renderAll();
  }

  function setTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('btn-theme-day').classList.toggle('active', theme === 'day');
    document.getElementById('btn-theme-night').classList.toggle('active', theme === 'night');
    renderAll();
  }

  function setScreen(screenId) {
    state.screen = screenId;
    document.getElementById('appFrame').setAttribute('data-screen', screenId);
    document.querySelectorAll('.screen-view').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-screen') === screenId);
    });
    document.querySelectorAll('.screen-pill').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-pill') === screenId);
    });
    renderNav();
  }

  function toggleVibe(id) {
    const idx = state.selectedThemes.indexOf(id);
    if (idx >= 0) {
      if (state.selectedThemes.length > 1) state.selectedThemes.splice(idx, 1);
    } else {
      state.selectedThemes.push(id);
    }
    renderPlan();
  }

  function setDuration(code) {
    state.duration = code;
    renderPlan();
  }

  renderAll();
</script>
</body>
</html>
